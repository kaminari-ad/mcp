# GitLab CI for @kaminari-ad/mcp.
#
# Stages:
#   1. setup           install deps, cache node_modules
#   2. quality         lint / format-check / typecheck   (parallel)
#   3. arch_gates      file-sizes / imports / shared-state / tool-naming (parallel)
#   4. security        npm audit / license-checker        (parallel)
#   5. test            unit / integration / isolation     (sequential, fail-fast)
#   6. build           tsup dist
#   7. publish         npm publish (TAG only)
#
# The `test:isolation` job is a non-negotiable merge gate.
# `setup` produces a `node_modules` artifact that downstream jobs reuse.

default:
  # Run on the mcp builder base (node 22 + build tooling) for local/CI/prod parity.
  # Pulled from the infra GitLab Container Registry (runner auto-auths via
  # CI_JOB_TOKEN; infra allowlists this repo). The deploy image is built by
  # arranger CodeBuild off the ECR base.
  image: gitlab.sdev.pw:5050/adverif/infra/kaminariad-mcp-base-builder:v1.1.0
  before_script:
    # Pulled image is alpine (no git); shell-executor runners are
    # debian/ubuntu (git already installed). Try `apk` then fall back
    # silently so both executor types work.
    - command -v apk >/dev/null 2>&1 && apk add --no-cache git || true
    - corepack disable 2>/dev/null || true

stages:
  - setup
  - quality
  - arch_gates
  - security
  - test
  - package
  - publish

# Single pipeline per commit. Without this rule GitLab creates BOTH
# a branch (`push`) pipeline AND a detached `merge_request_event`
# pipeline for every push to a branch that has an open MR — and the
# MR-event pipeline runs zero jobs (every job below targets
# `$CI_COMMIT_BRANCH`, which isn't set in MR-event context), so it
# always lands in `failed`/`canceled` and pollutes the MR head-pipeline
# badge. We run the full gate on the `push` pipeline; the MR-event
# pipeline is suppressed entirely.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

variables:
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"
  NPM_CONFIG_AUDIT: "false"

# ─────────────────────────────────────────────────────────────────────
# 1. SETUP — npm ci, cache node_modules, emit lockfile-pinned artefact
# ─────────────────────────────────────────────────────────────────────

setup:
  stage: setup
  script:
    # `--legacy-peer-deps` papers over peer-dep mismatches between
    # eslint 9.x and eslint-plugin-vitest's vendored typescript-eslint
    # (vitest plugin lags). Safe to drop once the plugin catches up to
    # @typescript-eslint/utils >= 8.x.
    - npm ci --ignore-scripts --legacy-peer-deps
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm-cache/
    policy: pull-push
  artifacts:
    expire_in: 1 hour
    paths:
      - node_modules/

# ─────────────────────────────────────────────────────────────────────
# 2. QUALITY (parallel)
# ─────────────────────────────────────────────────────────────────────

lint:
  stage: quality
  needs: [setup]
  script: npm run lint

format-check:
  stage: quality
  needs: [setup]
  script: npm run format:check

typecheck:
  stage: quality
  needs: [setup]
  script: npm run typecheck

# ─────────────────────────────────────────────────────────────────────
# 3. ARCH GATES (parallel) — all are merge blockers
# ─────────────────────────────────────────────────────────────────────

check:file-sizes:
  stage: arch_gates
  needs: [setup]
  script: npm run check:file-sizes

check:imports:
  stage: arch_gates
  needs: [setup]
  script: npm run check:imports

check:shared-state:
  stage: arch_gates
  needs: [setup]
  script: npm run check:shared-state

check:tool-naming:
  stage: arch_gates
  needs: [setup]
  script: npm run check:tool-naming

check:no-handwritten-parsers:
  stage: arch_gates
  needs: [setup]
  # Belt-and-suspenders gate against hand-written parser drift (see
  # CHANGELOG Phase 1 — 8 prod tool failures caused by parsers that
  # diverged from the API's actual response shapes). Forces every
  # `src/infrastructure/api/parsers/*.ts` to be backed by a generated
  # zod schema from `src/shared/api/zod-schemas.ts`.
  script: npm run check:no-handwritten-parsers

# ─────────────────────────────────────────────────────────────────────
# 4. SECURITY (parallel)
# ─────────────────────────────────────────────────────────────────────

audit:deps:
  stage: security
  needs: [setup]
  script: npm run audit:deps
  allow_failure: false

audit:licenses:
  stage: security
  needs: [setup]
  script: npm run audit:licenses

# ─────────────────────────────────────────────────────────────────────
# 5. TESTS
# ─────────────────────────────────────────────────────────────────────

test:unit:
  stage: test
  # `needs: setup` inherits the node_modules/ artifact; lint+typecheck
  # are gates we want green BEFORE tests run but don't re-export deps.
  needs: [setup, lint, typecheck]
  script: npm run test:unit -- --coverage

test:integration:
  stage: test
  needs: [setup, test:unit]
  script: npm run test:integration

# Tenant isolation suite — NON-NEGOTIABLE merge gate.
# Runs as a separate, named job so its failure is immediately
# attributable in the MR UI.
test:isolation:
  stage: test
  needs: [setup, test:unit]
  script: npm run test:isolation
  artifacts:
    when: always
    paths:
      - coverage/
    reports:
      junit: coverage/junit.xml

# ─────────────────────────────────────────────────────────────────────
# 6. BUILD
# ─────────────────────────────────────────────────────────────────────

build:
  stage: package
  needs:
    - setup
    - lint
    - format-check
    - typecheck
    - check:file-sizes
    - check:imports
    - check:shared-state
    - check:tool-naming
    - check:no-handwritten-parsers
    - audit:deps
    - audit:licenses
    - test:unit
    - test:integration
    - test:isolation
  script:
    - npm run build
    - npm run check:bundle-size
  artifacts:
    expire_in: 7 days
    paths:
      - dist/

# Prod smoke — fires a read-only subset of MCP tools at the deployed
# endpoint using a long-lived sandbox-org bearer.
#
# Catches drifts that escape compile-time gates: API shape changes
# between releases, feature-flag-gated routes flipping on/off,
# parser regressions invisible to fakes.
#
# Manual trigger by default (`when: manual`) so the job appears in
# the pipeline UI but doesn't burn CI minutes on every push. Flip
# to a daily schedule via GitLab CI/CD → Schedules once the sandbox
# org + token are provisioned (see the operations runbook).
#
# Required CI variables (both Masked + Protected):
#   KAMINARI_AD_MCP_PROD_TOKEN — long-lived bearer for a dedicated
#                                sandbox org. Rotated quarterly.
#   KAMINARI_AD_MCP_PROD_URL   — optional override; defaults to
#                                https://mcp.kaminari.ad/mcp.
prod:smoke:
  stage: test
  needs:
    - setup
  rules:
    - when: manual
      allow_failure: true
  variables:
    NPM_CONFIG_AUDIT: "false"
  script:
    - npm run prod:smoke

# ─────────────────────────────────────────────────────────────────────
# 7. PUBLISH — only on git tag matching vX.Y.Z
# ─────────────────────────────────────────────────────────────────────

publish:npm:
  stage: publish
  needs: [build]
  rules:
    # DISABLED — npm publish moved to GitHub Actions (.github/workflows/
    # release.yml) for OIDC provenance support. GitLab CI cannot produce
    # npm provenance attestations: only GitHub Actions, GitLab.com SaaS,
    # and CircleCI are in npm's OIDC trust list. Our self-hosted GitLab
    # is not, so a `--provenance` publish from here would either silently
    # ship an unsigned package or fail outright.
    #
    # The job stub stays for traceability (so a future maintainer searching
    # for "publish:npm" in this file lands on the explicit "we moved it"
    # explanation instead of finding nothing). To re-enable: pick a tag
    # build manually, but understand the loss of provenance.
    - when: never
  script:
    - echo "Publishing moved to GitHub Actions (.github/workflows/release.yml)."
    - echo "This stub is intentional and should not run."
    - exit 0

# GitLab CI for @kaminari-ad/mcp.
#
# Stages:
#   1. setup           install deps, cache node_modules
#   2. quality         lint / format-check / typecheck   (parallel)
#   3. arch_gates      file-sizes / imports / shared-state / tool-naming (parallel)
#   4. security        npm audit / license-checker        (parallel)
#   5. test            unit / integration / isolation     (sequential, fail-fast)
#   6. build           tsup dist
#   7. publish         npm publish (TAG only)
#
# The `test:isolation` job is a non-negotiable merge gate.
# `setup` produces a `node_modules` artifact that downstream jobs reuse.

default:
  # Node 22 LTS — required by undici 8.x (which lots of tooling now
  # pulls in transitively). Node 20 LTS support is extended until 2026
  # but the npm dep tree drifts toward 22 quickly.
  image: node:22-alpine
  before_script:
    # Pulled image is alpine (no git); shell-executor runners are
    # debian/ubuntu (git already installed). Try `apk` then fall back
    # silently so both executor types work.
    - command -v apk >/dev/null 2>&1 && apk add --no-cache git || true
    - corepack disable 2>/dev/null || true

stages:
  - setup
  - quality
  - arch_gates
  - security
  - test
  - build
  - publish

variables:
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"
  NPM_CONFIG_AUDIT: "false"

# ─────────────────────────────────────────────────────────────────────
# 1. SETUP — npm ci, cache node_modules, emit lockfile-pinned artefact
# ─────────────────────────────────────────────────────────────────────

setup:
  stage: setup
  script:
    # `--legacy-peer-deps` papers over peer-dep mismatches between
    # eslint 9.x and eslint-plugin-vitest's vendored typescript-eslint
    # (vitest plugin lags). Safe to drop once the plugin catches up to
    # @typescript-eslint/utils >= 8.x.
    - npm ci --ignore-scripts --legacy-peer-deps
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm-cache/
    policy: pull-push
  artifacts:
    expire_in: 1 hour
    paths:
      - node_modules/

# ─────────────────────────────────────────────────────────────────────
# 2. QUALITY (parallel)
# ─────────────────────────────────────────────────────────────────────

lint:
  stage: quality
  needs: [setup]
  script: npm run lint

format-check:
  stage: quality
  needs: [setup]
  script: npm run format:check

typecheck:
  stage: quality
  needs: [setup]
  script: npm run typecheck

# ─────────────────────────────────────────────────────────────────────
# 3. ARCH GATES (parallel) — all are merge blockers
# ─────────────────────────────────────────────────────────────────────

check:file-sizes:
  stage: arch_gates
  needs: [setup]
  script: npm run check:file-sizes

check:imports:
  stage: arch_gates
  needs: [setup]
  script: npm run check:imports

check:shared-state:
  stage: arch_gates
  needs: [setup]
  script: npm run check:shared-state

check:tool-naming:
  stage: arch_gates
  needs: [setup]
  script: npm run check:tool-naming

# ─────────────────────────────────────────────────────────────────────
# 4. SECURITY (parallel)
# ─────────────────────────────────────────────────────────────────────

audit:deps:
  stage: security
  needs: [setup]
  script: npm run audit:deps
  allow_failure: false

audit:licenses:
  stage: security
  needs: [setup]
  script: npm run audit:licenses

# ─────────────────────────────────────────────────────────────────────
# 5. TESTS
# ─────────────────────────────────────────────────────────────────────

test:unit:
  stage: test
  # `needs: setup` inherits the node_modules/ artifact; lint+typecheck
  # are gates we want green BEFORE tests run but don't re-export deps.
  needs: [setup, lint, typecheck]
  script: npm run test:unit -- --coverage

test:integration:
  stage: test
  needs: [setup, test:unit]
  script: npm run test:integration

# Tenant isolation suite — NON-NEGOTIABLE merge gate.
# Runs as a separate, named job so its failure is immediately
# attributable in the MR UI.
test:isolation:
  stage: test
  needs: [setup, test:unit]
  script: npm run test:isolation
  artifacts:
    when: always
    paths:
      - coverage/
    reports:
      junit: coverage/junit.xml

# ─────────────────────────────────────────────────────────────────────
# 6. BUILD
# ─────────────────────────────────────────────────────────────────────

build:
  stage: build
  needs:
    - setup
    - lint
    - format-check
    - typecheck
    - check:file-sizes
    - check:imports
    - check:shared-state
    - check:tool-naming
    - audit:deps
    - audit:licenses
    - test:unit
    - test:integration
    - test:isolation
  script:
    - npm run build
    - npm run check:bundle-size
  artifacts:
    expire_in: 7 days
    paths:
      - dist/

# Docker image build — exercises the SAME Dockerfile the production
# server runs. Catches Dockerfile regressions before they hit prod
# (e.g. `NODE_ENV=production` on the base stage silently omitting
# devDependencies and tsup failing at `Cannot find module typescript`;
# or `npm ci` peer-dep conflicts that don't appear in the host
# `npm ci --legacy-peer-deps` flow).
#
# Uses kaniko (no docker daemon) so it works on every GitLab runner
# type, including the docker-executor ones in this project where
# Docker-in-Docker service networking is not enabled. The image is
# built into the kaniko cache and discarded — production deploy still
# rebuilds on rnd. When we move to registry-pulled deploys, drop
# `--no-push` and add a `--destination $CI_REGISTRY_IMAGE:$CI_COMMIT_SHA`
# plus a registry-login step here.
#
# Runtime sanity (does the bundle resolve all deps?) is covered by
# `tests/integration/cli-smoke.test.ts` against the host-built
# `dist/bin.js`, so this job only has to prove the Dockerfile builds.
docker:build:
  stage: build
  needs:
    - setup
  image:
    name: gcr.io/kaniko-project/executor:v1.23.2-debug
    entrypoint: [""]
  before_script: []
  script:
    # `--single-snapshot` is intentionally NOT used — multi-stage
    # builds need a snapshot per RUN/COPY layer so files copied into
    # the build stage survive until `tsup` runs. Otherwise tsup
    # fails with "No input files" because src/ was reverted between
    # layers.
    #
    # `--tar-path` exports the image as an OCI tarball so the next
    # step can load it with `node` and actually boot it. Without this
    # sanity check, kaniko silently skips files excluded by
    # .dockerignore even when a COPY instruction references them —
    # a runtime image without LICENSE / README.md / SECURITY.md
    # would build "successfully" but explode at production
    # `docker compose build` (BuildKit is strict).
    - /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile "$CI_PROJECT_DIR/Dockerfile" --no-push --destination "kaminari-ad-mcp:ci" --tar-path image.tar
    # Verify every file referenced by COPY in the Dockerfile actually
    # made it into the image. Kaniko silently passes a build where
    # .dockerignore excluded a COPY target, so we have to check the
    # OCI tarball ourselves. Fails the job if any of the listed
    # files is missing — surfaces .dockerignore bugs in CI instead
    # of at `docker compose build` time on the production server.
    - apk add --no-cache jq tar
    - mkdir -p image-extracted
    - tar -xf image.tar -C image-extracted
    - jq -r '.[0].Layers[]' image-extracted/manifest.json > layers.txt
    - 'for layer in $(cat layers.txt); do tar -tf image-extracted/$layer 2>/dev/null; done | sort -u > files.txt'
    - 'for f in package.json LICENSE README.md SECURITY.md dist/bin.js node_modules/@modelcontextprotocol/sdk/package.json; do
        grep -q "^app/${f}\$" files.txt || { echo "missing in image: ${f}"; exit 1; };
      done'
    - 'echo "image contains all expected runtime files"'

# ─────────────────────────────────────────────────────────────────────
# 7. PUBLISH — only on git tag matching vX.Y.Z
# ─────────────────────────────────────────────────────────────────────

publish:npm:
  stage: publish
  needs: [build]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+(-[a-zA-Z0-9.-]+)?$/'
  # `NPM_TOKEN` MUST be configured in GitLab as a `Protected` AND
  # `Masked` CI/CD variable. Without `Masked`, an accidental
  # `set -x` or `npm publish --dry-run` could leak the token into the
  # job log. `Protected` keeps it scoped to protected tags only.
  variables:
    NPM_CONFIG_AUDIT: "false"
    # Force `npm config set` (below) NOT to echo the token. Belt and
    # suspenders alongside the GitLab masking.
    NPM_CONFIG_LOGLEVEL: "warn"
  script:
    # Sync the package.json version with the git tag (strip the `v`
    # prefix). package.json on the branch stays at `0.0.0-dev` —
    # `npm version` writes the tagged version without committing.
    - VERSION="${CI_COMMIT_TAG#v}"
    - 'echo "Publishing version: $VERSION"'
    - npm version "$VERSION" --no-git-tag-version --allow-same-version
    # Use `npm config set --location project` to write the token into
    # a project-scoped `.npmrc` that is wiped with the job's working
    # directory. Token never crosses stdout.
    - npm config set --location project "//registry.npmjs.org/:_authToken=$NPM_TOKEN"
    - npm publish --provenance --access public

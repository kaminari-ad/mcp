# Trial of adverif/ci node-services at main.
# Lint runs eslint. Check runs format, typecheck, tests, architecture
# gates, audits, and the bundle-size gate, and stops on the first failure.
# Security skips only the image scan: node:22.23.4 ships npm 10.9.9, and
# no current Node image has those HIGH fixes yet.
# Arranger CodeBuild still builds the deploy image from the ECR defaults
# in .arranger/Dockerfile.
include:
  - project: adverif/ci
    ref: main
    file: node-services/entrypoint.yaml

# GitLab replaces this list instead of merging it with the entrypoint.
stages:
  - lint
  - check
  - build
  - security

# One pipeline per commit. An open MR runs the merge-request pipeline only.
# Policy jobs are injected into the branch pipeline and keep it from reaching
# success, which would fail only_allow_merge_if_pipeline_succeeds.
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS == ""

variables:
  DOCKER_TLS_CERTDIR: ""
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_UPDATE_NOTIFIER: "false"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_CACHE: .npm-cache
  BUILDER_IMAGE: gitlab.sdev.pw:5050/adverif/infra/kaminariad-mcp-base-builder:v1.3.0

.node_setup: &node_setup
  image: $BUILDER_IMAGE
  cache:
    key:
      files: [package-lock.json]
      prefix: builder
    paths: [$NPM_CONFIG_CACHE]
  before_script:
    - command -v apk >/dev/null 2>&1 && apk add --no-cache git || true
    - corepack disable 2>/dev/null || true
    - npm ci --ignore-scripts --legacy-peer-deps

# One package, so this is the eslint script. Check waits for this stage.
Lint:
  <<: *node_setup
  script:
    - npm run lint

# format and typecheck are not part of the test scripts. Architecture
# gates, audits, and the bundle-size check used to be separate jobs.
# CI=true makes vitest write coverage/junit.xml; isolation runs last.
Check:
  <<: *node_setup
  script:
    - npm run format:check
    - npm run typecheck
    - npm run test:unit -- --coverage
    - npm run test:integration
    - npm run test:isolation
    - npm run check:file-sizes
    - npm run check:imports
    - npm run check:shared-state
    - npm run check:tool-naming
    - npm run check:no-handwritten-parsers
    - npm run check:api-coverage
    - npm run check:tool-enum-drift
    - npm run audit:deps
    - npm run audit:licenses
    - npm run build
    - npm run check:bundle-size
  artifacts:
    paths:
      - coverage/junit.xml
    reports:
      junit: coverage/junit.xml

# Manual read-only smoke against the deployed MCP. Kept from the previous
# pipeline. Needs KAMINARI_AD_MCP_PROD_TOKEN; KAMINARI_AD_MCP_PROD_URL is
# optional. Does not block the merge.
prod:smoke:
  <<: *node_setup
  stage: check
  needs: []
  rules:
    - when: manual
      allow_failure: true
  script:
    - npm run prod:smoke

# The CI image supplies the Docker CLI. services: [] replaces the template
# dind service. These runners mount the host socket, and dind fails to start
# while that socket is mounted.
Build:
  image: gitlab.sdev.pw:5050/adverif/ci:latest
  services: []
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - >-
      docker build
      --build-arg BUILDER_BASE=gitlab.sdev.pw:5050/adverif/infra/kaminariad-mcp-base-builder:v1.3.0
      --build-arg RUNTIME_BASE=gitlab.sdev.pw:5050/adverif/infra/kaminariad-mcp-base-runtime:v1.3.0
      -f .arranger/Dockerfile
      -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
      .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"

# Template on main keeps Semgrep and trivy fs. The image scan stays off.
Security:
  variables:
    SKIP_TRIVY_IMAGE: true

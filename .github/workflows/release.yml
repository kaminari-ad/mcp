name: Release

# Tag-driven publish. Push `vMAJOR.MINOR.PATCH` (e.g. `v0.1.0`) to
# this repo and the workflow:
#   1. Pauses on the `npm-publish` GitHub Environment (single-approver
#      gate — protects against accidental tag push).
#   2. Verifies the tag matches `package.json` version.
#   3. Runs the full sanity gate (lint / typecheck / tests / build).
#   4. `npm publish --provenance` — uses the GitHub OIDC token to mint
#      a sigstore attestation; npm trusted-publisher setup on the
#      package side translates this into a verified provenance badge.
#   5. Creates a GitHub Release with auto-generated commit summary.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # softprops/action-gh-release creates the Release
  id-token: write # mandatory for npm OIDC provenance

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    # Single-approver gate. Configured via `gh api repos/.../environments/npm-publish`.
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@kaminari-ad/mcp

    steps:
      # Action versions pinned at major. Bumped from v4/v2 → v6/v3 in
      # 2026-05 because GitHub deprecated Node 20 runtimes inside JS
      # actions (forced default Node 24 from 2026-06-02, Node 20 removed
      # from runner on 2026-09-16). v6 lines of checkout / setup-node
      # and v3 of action-gh-release all ship Node 24 natively.
      - uses: actions/checkout@v6
        with:
          # Full history so action-gh-release can derive release notes
          # from commits since the previous tag.
          fetch-depth: 0

      # Use Node 24 for the RELEASE job only (CI and local dev stay on
      # Node 22 per .nvmrc). Reason: npm Trusted Publisher OIDC publish
      # support was added in npm 11.5.1 (Aug 2025); Node 22 LTS ships
      # with npm 10.x bundled, Node 24+ bundles npm 11+. Without npm
      # 11.5+, `npm publish --provenance` signs the sigstore attestation
      # but sends the actual PUT unauthenticated → HTTP 404 (registry
      # obscurity for "no credentials").
      #
      # Previous attempts to upgrade in-place (`npm install -g npm@^11`
      # broke with `Cannot find module 'promise-retry'`; `corepack
      # prepare npm@^11 --activate` left bundled npm 10.x active because
      # Corepack shims weren't first in PATH). Using a newer Node is the
      # least-magic path.
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Verify npm supports OIDC publish (>= 11.5.1)
        run: |
          NPM_VER=$(npm --version)
          echo "npm version: $NPM_VER"
          MAJOR=$(echo "$NPM_VER" | cut -d. -f1)
          if [ "$MAJOR" -lt 11 ]; then
            echo "ERROR: npm $NPM_VER is too old for OIDC publish (need >= 11.5.1)"
            exit 1
          fi

      - name: Install
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Verify tag matches package.json version
        # Belt-and-suspenders against "tagged but forgot to bump
        # package.json" — would otherwise publish the previous version
        # under a new tag and confuse npm's @kaminari-ad/mcp@vX.Y.Z
        # vs `kaminari-ad-mcp/releases/tag/vX.Y.Z` correspondence.
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: git tag '$GITHUB_REF_NAME' (-> $TAG_VERSION)"
            echo "       does NOT match package.json version ($PKG_VERSION)."
            echo "       Bump package.json and re-tag."
            exit 1
          fi
          echo "Tag/version match: $TAG_VERSION"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (with coverage)
        run: npm run test:cov

      - name: Build
        run: npm run build

      - name: Bundle size gate
        run: npm run check:bundle-size

      # Diagnostic: print the OIDC subject claim that npm sees. If
      # the publish step below returns HTTP 404, compare this `sub`
      # / `workflow` / `environment` against the npm Trusted Publisher
      # config — npm hides auth failures as 404 for security obscurity,
      # so this step is the only way to debug a mismatch.
      #
      # Logs only the public JWT payload (claims) — the signed token
      # itself is short-lived and not printed.
      - name: Debug OIDC subject claim for npm
        run: |
          set -e
          RESPONSE=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org")
          TOKEN=$(echo "$RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin)['value'])")
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          PAD=$(( (4 - ${#PAYLOAD} % 4) % 4 ))
          if [ "$PAD" -gt 0 ]; then PAYLOAD="${PAYLOAD}$(printf '=%.0s' $(seq 1 $PAD))"; fi
          DECODED=$(echo "$PAYLOAD" | base64 -d 2>/dev/null)
          echo "::group::Full OIDC JWT payload (audience: npm:registry.npmjs.org)"
          echo "$DECODED" | python3 -m json.tool
          echo "::endgroup::"
          echo "Key claims for Trusted Publisher matching:"
          echo "$DECODED" | python3 -c "
          import json, sys
          c = json.load(sys.stdin)
          for k in ('sub', 'repository', 'repository_owner', 'workflow', 'workflow_ref', 'job_workflow_ref', 'ref', 'event_name', 'environment'):
              print(f'  {k} = {c.get(k)!r}')
          "

      # OIDC publish with provenance attestation. v0.1.0 used a
      # classic NPM_TOKEN (npm requires an existing package to register
      # a Trusted Publisher); v0.1.2+ ships with full provenance:
      #   - permissions.id-token: write (declared above)
      #   - Trusted Publisher registered on the package settings page
      #     pointing at this workflow + the `npm-publish` environment
      #   - publishConfig.provenance: true in package.json
      #   - explicit --provenance flag below for defense-in-depth
      - name: Publish to npm with provenance (OIDC)
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # Auto-summary of commits since the previous tag. For v0.1.0
          # this collapses the full development arc; subsequent releases
          # will produce focused per-version notes.
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ## Install

            **npm (stdio + HTTP):**

            ```bash
            npx -y @kaminari-ad/mcp@${{ github.ref_name }}
            ```

            **Claude Desktop extension (one-click install):**

            Download `kaminari-ad-mcp.mcpb` from this release and double-click.

            Full configuration docs — see [README](README.md#install).
            Full changelog — see [CHANGELOG.md](CHANGELOG.md).

  # ──────────────────────────────────────────────────────────────────
  # Claude Desktop extension (.mcpb) build + upload to GitHub Release.
  #
  # Runs in parallel with `publish` (npm). Either job may create the
  # release first; `gh release create ... || true` + `--clobber` on
  # upload handle the race. No environment gate — the .mcpb is just a
  # build artefact, not a credential-bearing publish like npm.
  # ──────────────────────────────────────────────────────────────────
  publish-mcpb:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Build single-file bundle for .mcpb
        # tsup.mcpb.config.ts inlines all runtime deps into one ESM
        # file — Claude Desktop extracts the .mcpb and runs
        # `node server/index.js` with no further install step.
        run: npm run build:mcpb-bundle

      - name: Prepare mcpb-bundle/ directory
        run: |
          mkdir -p mcpb-bundle/server
          cp dist-mcpb/index.js mcpb-bundle/server/index.js

      - name: Write manifest.json from package.json
        # Generated inline (not a checked-in file) so the version
        # stays in lockstep with package.json — no extra bump to keep
        # in sync. Mirrors the structure of @anthropic-ai/mcpb's
        # manifest-version 0.3 schema; user_config drives the
        # config form that Claude Desktop shows during install.
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const manifest = {
              manifest_version: '0.3',
              name: 'kaminari-ad-mcp',
              display_name: 'Kaminari Ad',
              version: pkg.version,
              description: pkg.description,
              author: { name: 'Kaminari Ad', email: 'hello@kaminari.ad', url: 'https://kaminari.ad' },
              license: 'MIT',
              homepage: 'https://kaminari.ad/mcp',
              documentation: 'https://github.com/kaminari-ad/mcp#readme',
              repository: { type: 'git', url: 'https://github.com/kaminari-ad/mcp.git' },
              privacy_policies: ['https://kaminari.ad/privacy'],
              keywords: ['ad-verification', 'malvertising', 'cursor', 'claude', 'kaminari'],
              server: {
                type: 'node',
                entry_point: 'server/index.js',
                mcp_config: {
                  command: 'node',
                  args: ['\${__dirname}/server/index.js'],
                  env: {
                    KAMINARI_AD_API_KEY: '\${user_config.api_key}',
                    KAMINARI_AD_API_URL: '\${user_config.api_url}'
                  }
                }
              },
              user_config: {
                terms_accepted: {
                  type: 'boolean',
                  title: 'I agree to Kaminari Ad Terms of Service',
                  description: 'https://kaminari.ad/user-agreement',
                  required: true,
                  default: false
                },
                api_key: {
                  type: 'string',
                  title: 'Kaminari Ad API Key',
                  description: 'Generate at app.kaminari.ad -> Settings -> API Keys',
                  sensitive: true,
                  required: true
                },
                api_url: {
                  type: 'string',
                  title: 'API URL',
                  description: 'Leave default unless on a self-hosted deployment.',
                  required: false,
                  default: 'https://app.kaminari.ad'
                }
              },
              compatibility: {
                platforms: ['darwin', 'win32', 'linux'],
                runtimes: { node: '>=22.19.0' }
              }
            };
            fs.writeFileSync('mcpb-bundle/manifest.json', JSON.stringify(manifest, null, 2));
            console.log('manifest.json written for version ' + pkg.version);
          "

      - name: Pack .mcpb
        run: |
          cd mcpb-bundle
          npx -y @anthropic-ai/mcpb@latest pack .
          mv ./*.mcpb kaminari-ad-mcp.mcpb
          ls -lh kaminari-ad-mcp.mcpb

      - name: Verify bundle size (< 20 MB)
        # 25 MB is GitHub's per-release-asset CDN limit; 20 MB is our
        # ceiling for headroom + good Claude Desktop UX. If this trips,
        # audit deps in src/ for over-inclusive imports — the bundle
        # should be ~1-3 MB given the dep tree.
        run: |
          SIZE=$(stat -c%s mcpb-bundle/kaminari-ad-mcp.mcpb)
          MB=$((SIZE / 1024 / 1024))
          echo "Bundle size: ${MB} MB (${SIZE} bytes)"
          if [ "$MB" -gt 20 ]; then
            echo "ERROR: bundle exceeds 20 MB"
            exit 1
          fi

      - name: Smoke test
        # Unpack and run the bundle in stdio mode with an `initialize`
        # JSON-RPC request. Verifies the bundle starts and the server
        # is reachable. KAMINARI_AD_API_KEY=ci-dummy-key is needed to
        # pass the stdio API-key precheck (see stdio-bootstrap.ts).
        run: |
          set -e
          mkdir -p /tmp/mcpb-test && cd /tmp/mcpb-test
          unzip -q "$GITHUB_WORKSPACE/mcpb-bundle/kaminari-ad-mcp.mcpb"
          INIT='{"jsonrpc":"2.0","method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"ci","version":"1.0"}},"id":0}'
          OUT=$(echo "$INIT" | KAMINARI_AD_API_KEY=ci-dummy-key node server/index.js 2>/dev/null || true)
          echo "$OUT" | node -e "
            let d='';
            process.stdin.on('data', c => d += c);
            process.stdin.on('end', () => {
              const lines = d.trim().split('\n').filter(Boolean);
              const last = lines[lines.length - 1];
              const r = JSON.parse(last);
              if (!r.result || !r.result.serverInfo) {
                console.error('FAIL: no serverInfo in response');
                console.error(d);
                process.exit(1);
              }
              console.log('OK: serverInfo.name =', r.result.serverInfo.name, '| version =', r.result.serverInfo.version);
            });
          "

      - name: Create GitHub Release (no-op if publish job created it first)
        run: gh release create ${{ github.ref_name }} --generate-notes || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload .mcpb to GitHub Release
        run: gh release upload ${{ github.ref_name }} mcpb-bundle/kaminari-ad-mcp.mcpb --clobber
        env:
          GH_TOKEN: ${{ github.token }}

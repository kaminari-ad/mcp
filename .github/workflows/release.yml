name: Release

# Tag-driven publish. Push `vMAJOR.MINOR.PATCH` (e.g. `v0.1.0`) to
# this repo and the workflow:
#   1. Pauses on the `npm-publish` GitHub Environment (single-approver
#      gate — protects against accidental tag push).
#   2. Verifies the tag matches `package.json` version.
#   3. Runs the full sanity gate (lint / typecheck / tests / build).
#   4. `npm publish --provenance` — uses the GitHub OIDC token to mint
#      a sigstore attestation; npm trusted-publisher setup on the
#      package side translates this into a verified provenance badge.
#   5. Creates a GitHub Release with auto-generated commit summary.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # softprops/action-gh-release creates the Release
  id-token: write # mandatory for npm OIDC provenance

jobs:
  publish:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    # Single-approver gate. Configured via `gh api repos/.../environments/npm-publish`.
    environment:
      name: npm-publish
      url: https://www.npmjs.com/package/@kaminari-ad/mcp

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so action-gh-release can derive release notes
          # from commits since the previous tag.
          fetch-depth: 0

      # Use Node 24 for the RELEASE job only (CI and local dev stay on
      # Node 22 per .nvmrc). Reason: npm Trusted Publisher OIDC publish
      # support was added in npm 11.5.1 (Aug 2025); Node 22 LTS ships
      # with npm 10.x bundled, Node 24+ bundles npm 11+. Without npm
      # 11.5+, `npm publish --provenance` signs the sigstore attestation
      # but sends the actual PUT unauthenticated → HTTP 404 (registry
      # obscurity for "no credentials").
      #
      # Previous attempts to upgrade in-place (`npm install -g npm@^11`
      # broke with `Cannot find module 'promise-retry'`; `corepack
      # prepare npm@^11 --activate` left bundled npm 10.x active because
      # Corepack shims weren't first in PATH). Using a newer Node is the
      # least-magic path.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          registry-url: "https://registry.npmjs.org"

      - name: Verify npm supports OIDC publish (>= 11.5.1)
        run: |
          NPM_VER=$(npm --version)
          echo "npm version: $NPM_VER"
          MAJOR=$(echo "$NPM_VER" | cut -d. -f1)
          if [ "$MAJOR" -lt 11 ]; then
            echo "ERROR: npm $NPM_VER is too old for OIDC publish (need >= 11.5.1)"
            exit 1
          fi

      - name: Install
        run: npm ci --legacy-peer-deps --ignore-scripts

      - name: Verify tag matches package.json version
        # Belt-and-suspenders against "tagged but forgot to bump
        # package.json" — would otherwise publish the previous version
        # under a new tag and confuse npm's @kaminari-ad/mcp@vX.Y.Z
        # vs `kaminari-ad-mcp/releases/tag/vX.Y.Z` correspondence.
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: git tag '$GITHUB_REF_NAME' (-> $TAG_VERSION)"
            echo "       does NOT match package.json version ($PKG_VERSION)."
            echo "       Bump package.json and re-tag."
            exit 1
          fi
          echo "Tag/version match: $TAG_VERSION"

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test (with coverage)
        run: npm run test:cov

      - name: Build
        run: npm run build

      - name: Bundle size gate
        run: npm run check:bundle-size

      # Diagnostic: print the OIDC subject claim that npm sees. If
      # the publish step below returns HTTP 404, compare this `sub`
      # / `workflow` / `environment` against the npm Trusted Publisher
      # config — npm hides auth failures as 404 for security obscurity,
      # so this step is the only way to debug a mismatch.
      #
      # Logs only the public JWT payload (claims) — the signed token
      # itself is short-lived and not printed.
      - name: Debug OIDC subject claim for npm
        run: |
          set -e
          RESPONSE=$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org")
          TOKEN=$(echo "$RESPONSE" | python3 -c "import json,sys; print(json.load(sys.stdin)['value'])")
          PAYLOAD=$(echo "$TOKEN" | cut -d. -f2 | tr '_-' '/+')
          PAD=$(( (4 - ${#PAYLOAD} % 4) % 4 ))
          if [ "$PAD" -gt 0 ]; then PAYLOAD="${PAYLOAD}$(printf '=%.0s' $(seq 1 $PAD))"; fi
          DECODED=$(echo "$PAYLOAD" | base64 -d 2>/dev/null)
          echo "::group::Full OIDC JWT payload (audience: npm:registry.npmjs.org)"
          echo "$DECODED" | python3 -m json.tool
          echo "::endgroup::"
          echo "Key claims for Trusted Publisher matching:"
          echo "$DECODED" | python3 -c "
          import json, sys
          c = json.load(sys.stdin)
          for k in ('sub', 'repository', 'repository_owner', 'workflow', 'workflow_ref', 'job_workflow_ref', 'ref', 'event_name', 'environment'):
              print(f'  {k} = {c.get(k)!r}')
          "

      # OIDC publish with provenance attestation. v0.1.0 used a
      # classic NPM_TOKEN (npm requires an existing package to register
      # a Trusted Publisher); v0.1.2+ ships with full provenance:
      #   - permissions.id-token: write (declared above)
      #   - Trusted Publisher registered on the package settings page
      #     pointing at this workflow + the `npm-publish` environment
      #   - publishConfig.provenance: true in package.json
      #   - explicit --provenance flag below for defense-in-depth
      - name: Publish to npm with provenance (OIDC)
        run: npm publish --access public --provenance

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          # Auto-summary of commits since the previous tag. For v0.1.0
          # this collapses the full development arc; subsequent releases
          # will produce focused per-version notes.
          generate_release_notes: true
          fail_on_unmatched_files: false
          body: |
            ## Install

            ```bash
            npx -y @kaminari-ad/mcp@${{ github.ref_name }}
            ```

            Add to your Cursor / Claude Desktop config — see
            [README](README.md#quick-start).

            Full changelog: [CHANGELOG.md](CHANGELOG.md).
